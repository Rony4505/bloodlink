[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# BloodLink service: APP_MODE=bloodlink (Dockerfile default)
# Smart craft service: set build/runtime APP_MODE=fashion + NEXT_PUBLIC_SITE_URL=https://smartcraftcorner.com
# See SMARTCRAFT_DEPLOY.md

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
